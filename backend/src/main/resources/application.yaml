spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/logistic_db
    username: logistic_user
    password: logistic_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        jdbc:
          "[time_zone]": UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms